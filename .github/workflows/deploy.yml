name: Publica demonstração no GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos do repositório
        uses: actions/checkout@v6

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar arquivos da página
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
